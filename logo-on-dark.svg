<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 72" width="196" height="72" role="img" aria-labelledby="solazul-logo-dark-title">
  <title id="solazul-logo-dark-title">Solazul AI Technology</title>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#ff8a1f"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fc0ff"/>
      <stop offset="1" stop-color="#5b92ff"/>
    </linearGradient>
  </defs>

  <!-- For dark or blue backgrounds -->
  <g transform="translate(-9 4)" fill="none" stroke-width="8" stroke-linecap="butt">
    <path d="M43.3 12.5A13 13 0 1 0 32 32" stroke="url(#sun)"/>
    <path d="M32 32A13 13 0 1 1 20.7 51.5" stroke="url(#azul)"/>
    <circle cx="43.3" cy="12.5" r="7" fill="url(#sun)" stroke="none"/>
    <circle cx="20.7" cy="51.5" r="5.5" fill="url(#azul)" stroke="none"/>
  </g>

  <text x="52" y="40" font-family="'Familjen Grotesk','Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="35" font-weight="700" letter-spacing="-0.7" fill="#ffffff">Solazul</text>
  <text x="53" y="59" font-family="'Familjen Grotesk','Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" letter-spacing="1.1" fill="#c6d2f5">AI Technology</text>
</svg>
